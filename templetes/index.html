<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Cancellation Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #173f73;
            text-align: center;
        }

        .description {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select {
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #173f73;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d2b53;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            background: #e5f5e8;
            font-size: 18px;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🏨 Hotel Booking Cancellation Predictor</h1>

        <p class="description">
            Enter booking details to predict whether the booking is likely to be cancelled.
        </p>

        <form method="POST">
            <div class="form-grid">

                <div class="field">
                    <label>Hotel Type</label>
                    <select name="hotel">
                        <option>City Hotel</option>
                        <option>Resort Hotel</option>
                    </select>
                </div>

                <div class="field">
                    <label>Lead Time (days)</label>
                    <input type="number" name="lead_time" min="0" value="30" required>
                </div>

                <div class="field">
                    <label>Arrival Year</label>
                    <select name="arrival_date_year">
                        <option value="2015">2015</option>
                        <option value="2016">2016</option>
                        <option value="2017">2017</option>
                    </select>
                </div>

                <div class="field">
                    <label>Arrival Month</label>
                    <select name="arrival_date_month">
                        <option>January</option><option>February</option>
                        <option>March</option><option>April</option>
                        <option>May</option><option>June</option>
                        <option>July</option><option>August</option>
                        <option>September</option><option>October</option>
                        <option>November</option><option>December</option>
                    </select>
                </div>

                <div class="field">
                    <label>Arrival Week Number</label>
                    <input type="number" name="arrival_date_week_number" min="1" max="53" value="25" required>
                </div>

                <div class="field">
                    <label>Arrival Day</label>
                    <input type="number" name="arrival_date_day_of_month" min="1" max="31" value="15" required>
                </div>

                <div class="field">
                    <label>Weekend Nights</label>
                    <input type="number" name="stays_in_weekend_nights" min="0" value="1" required>
                </div>

                <div class="field">
                    <label>Weekday Nights</label>
                    <input type="number" name="stays_in_week_nights" min="0" value="2" required>
                </div>

                <div class="field">
                    <label>Adults</label>
                    <input type="number" name="adults" min="1" value="2" required>
                </div>

                <div class="field">
                    <label>Children</label>
                    <input type="number" name="children" min="0" value="0" required>
                </div>

                <div class="field">
                    <label>Babies</label>
                    <input type="number" name="babies" min="0" value="0" required>
                </div>

                <div class="field">
                    <label>Meal Plan</label>
                    <select name="meal">
                        <option>BB</option><option>HB</option>
                        <option>FB</option><option>SC</option>
                        <option>Undefined</option>
                    </select>
                </div>

                <div class="field">
                    <label>Country Code</label>
                    <input type="text" name="country" value="PRT" required>
                </div>

                <div class="field">
                    <label>Market Segment</label>
                    <select name="market_segment">
                        <option>Online TA</option>
                        <option>Offline TA/TO</option>
                        <option>Direct</option>
                        <option>Groups</option>
                        <option>Corporate</option>
                        <option>Complementary</option>
                    </select>
                </div>

                <div class="field">
                    <label>Distribution Channel</label>
                    <select name="distribution_channel">
                        <option>TA/TO</option>
                        <option>Direct</option>
                        <option>Corporate</option>
                        <option>GDS</option>
                        <option>Undefined</option>
                    </select>
                </div>

                <div class="field">
                    <label>Repeated Guest?</label>
                    <select name="is_repeated_guest">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="field">
                    <label>Previous Cancellations</label>
                    <input type="number" name="previous_cancellations" min="0" value="0" required>
                </div>

                <div class="field">
                    <label>Previous Non-Cancelled Bookings</label>
                    <input type="number" name="previous_bookings_not_canceled" min="0" value="0" required>
                </div>

                <div class="field">
                    <label>Reserved Room Type</label>
                    <select name="reserved_room_type">
                        <option>A</option><option>B</option><option>C</option>
                        <option>D</option><option>E</option><option>F</option>
                        <option>G</option><option>H</option><option>L</option><option>P</option>
                    </select>
                </div>

                <div class="field">
                    <label>Assigned Room Type</label>
                    <select name="assigned_room_type">
                        <option>A</option><option>B</option><option>C</option>
                        <option>D</option><option>E</option><option>F</option>
                        <option>G</option><option>H</option><option>L</option><option>P</option>
                    </select>
                </div>

                <div class="field">
                    <label>Deposit Type</label>
                    <select name="deposit_type">
                        <option>No Deposit</option>
                        <option>Non Refund</option>
                        <option>Refundable</option>
                    </select>
                </div>

                <div class="field">
                    <label>Days in Waiting List</label>
                    <input type="number" name="days_in_waiting_list" min="0" value="0" required>
                </div>

                <div class="field">
                    <label>Customer Type</label>
                    <select name="customer_type">
                        <option>Transient</option>
                        <option>Transient-Party</option>
                        <option>Contract</option>
                        <option>Group</option>
                    </select>
                </div>

                <div class="field">
                    <label>Average Daily Rate (ADR)</label>
                    <input type="number" name="adr" min="0" step="0.01" value="100" required>
                </div>

                <div class="field">
                    <label>Car Parking Spaces Required</label>
                    <input type="number" name="required_car_parking_spaces" min="0" value="0" required>
                </div>

                <div class="field">
                    <label>Special Requests</label>
                    <input type="number" name="total_of_special_requests" min="0" value="0" required>
                </div>

            </div>

            <button type="submit">Predict Cancellation</button>
        </form>

        {% if result %}
        <div class="result">
            <strong>{{ result }}</strong>
            <br><br>
            Cancellation Probability:
            <strong>{{ "%.2f"|format(probability) }}%</strong>
        </div>
        {% endif %}
    </div>
</body>
</html>
